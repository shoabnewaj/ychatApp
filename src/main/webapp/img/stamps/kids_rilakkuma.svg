<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="kumaBrown" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#b45309"/><stop offset="100%" stop-color="#78350f"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Round Brown Bear Ears with Yellow Insides -->
    <circle cx="48" cy="48" r="16" fill="url(#kumaBrown)"/>
    <circle cx="48" cy="48" r="9" fill="#fde047"/>
    <circle cx="112" cy="48" r="16" fill="url(#kumaBrown)"/>
    <circle cx="112" cy="48" r="9" fill="#fde047"/>
    <!-- Round Relaxed Bear Head -->
    <ellipse cx="80" cy="78" rx="52" ry="40" fill="url(#kumaBrown)"/>
    <!-- White Oval Muzzle -->
    <ellipse cx="80" cy="85" rx="18" ry="14" fill="#ffffff"/>
    <!-- Triangular Black Nose & Y-shaped Mouth -->
    <polygon points="80,78 76,83 84,83" fill="#0f172a"/>
    <line x1="80" y1="83" x2="80" y2="90" stroke="#0f172a" stroke-width="2"/>
    <path d="M74,92 Q80,88 86,92" stroke="#0f172a" stroke-width="2" fill="none"/>
    <!-- Two Simple Round Black Eyes (Spaced Wide Apart) -->
    <circle cx="58" cy="74" r="4.5" fill="#0f172a"/>
    <circle cx="102" cy="74" r="4.5" fill="#0f172a"/>
    <!-- Sweet 3-Color Dango Skewer in Hand -->
    <line x1="22" y1="125" x2="42" y2="85" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="38" cy="92" r="6" fill="#f472b6"/>
    <circle cx="32" cy="104" r="6" fill="#ffffff"/>
    <circle cx="26" cy="116" r="6" fill="#86efac"/>
    <!-- Banner -->
    <rect x="22" y="134" width="116" height="22" rx="11" fill="#78350f" stroke="#fde047" stroke-width="1.5"/>
    <text x="80" y="149" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">RELAX~ 🍡</text>
  </g>
</svg>