<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="shibaGold" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Ears -->
    <polygon points="40,25 20,65 55,57" fill="#b45309"/>
    <polygon points="120,25 105,57 140,65" fill="#b45309"/>
    <!-- Police / Officer Cap -->
    <ellipse cx="80" cy="34" rx="35" ry="14" fill="#1e3a8a"/>
    <path d="M55,34 Q80,15 105,34 Z" fill="#1e40af"/>
    <rect x="52" y="32" width="56" height="5" fill="#0f172a"/>
    <circle cx="80" cy="27" r="6" fill="#fbbf24"/>
    <!-- Head -->
    <ellipse cx="80" cy="76" rx="54" ry="46" fill="url(#shibaGold)"/>
    <ellipse cx="80" cy="88" rx="26" ry="18" fill="#ffffff"/>
    <!-- Eyebrows -->
    <circle cx="58" cy="54" r="4" fill="#ffffff"/>
    <circle cx="102" cy="54" r="4" fill="#ffffff"/>
    <!-- Determined Eyes -->
    <circle cx="62" cy="66" r="6" fill="#1e293b"/>
    <circle cx="60" cy="64" r="2" fill="#fff"/>
    <circle cx="98" cy="66" r="6" fill="#1e293b"/>
    <circle cx="96" cy="64" r="2" fill="#fff"/>
    <ellipse cx="80" cy="78" rx="6" ry="4" fill="#1e293b"/>
    <path d="M74,84 Q80,90 86,84" fill="none" stroke="#1e293b" stroke-width="2"/>
    <!-- Saluting Paw -->
    <g transform="translate(108, 45) rotate(-20)">
      <rect x="0" y="0" width="16" height="26" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
      <circle cx="8" cy="6" r="4" fill="#fda4af"/>
    </g>
    <!-- Banner -->
    <rect x="30" y="130" width="100" height="24" rx="12" fill="#1e40af"/>
    <text x="80" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">YES BOSS! ｫ｡</text>
  </g>
</svg>