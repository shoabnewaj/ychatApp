<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="skin" cx="50%" cy="45%" r="50%"><stop offset="0%" stop-color="#fff5eb"/><stop offset="100%" stop-color="#fed7aa"/></radialGradient>
    <linearGradient id="pinkSpikes" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#9d174d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Swept Up Spiky Pink Hair with Black Undercut -->
    <polygon points="35,55 15,32 38,28 25,8 52,18 65,2 80,15 95,2 108,18 135,8 122,28 145,32 125,55" fill="url(#pinkSpikes)"/>
    <ellipse cx="80" cy="55" rx="42" ry="20" fill="#0f172a"/>
    <!-- Face -->
    <polygon points="46,65 80,122 114,65" fill="url(#skin)"/>
    <ellipse cx="80" cy="80" rx="36" ry="38" fill="url(#skin)"/>
    <!-- Cursed Black Tattoo Markings on Forehead & Cheeks -->
    <line x1="80" y1="52" x2="80" y2="65" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="68" r="2.5" fill="#0f172a"/>
    <!-- Tribal Eye Lines -->
    <path d="M48,72 Q60,66 72,74" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <path d="M112,72 Q100,66 88,74" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Sukuna Eyes (Red demonic pupils) -->
    <polygon points="56,76 72,78 69,85 58,84" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <circle cx="65" cy="80" r="3" fill="#dc2626"/>
    <polygon points="88,78 104,76 102,84 91,85" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <circle cx="95" cy="80" r="3" fill="#dc2626"/>
    <!-- Two extra eye slits under main eyes -->
    <path d="M56,88 Q64,91 72,88" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="64" cy="89" r="1.5" fill="#dc2626"/>
    <path d="M88,88 Q96,91 104,88" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="96" cy="89" r="1.5" fill="#dc2626"/>
    <!-- Menacing Sharp-Toothed Grin / Tongue out -->
    <path d="M60,98 Q80,122 100,98 Z" fill="#450a0a" stroke="#0f172a" stroke-width="2"/>
    <path d="M62,99 L66,104 L70,99 L74,104 L78,99 L82,104 L86,99 L90,104 L94,99 L98,104" fill="#ffffff"/>
    <ellipse cx="80" cy="110" rx="8" ry="6" fill="#f43f5e"/>
    <!-- White Kimono / Black sash -->
    <path d="M42,120 L30,140 L130,140 L118,120 Z" fill="#f8fafc"/>
    <polygon points="70,120 80,135 90,120" fill="#0f172a"/>
    <!-- Banner -->
    <rect x="20" y="134" width="120" height="22" rx="11" fill="#7f1d1d" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="80" y="149" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">SUKUNA 😈</text>
  </g>
</svg>