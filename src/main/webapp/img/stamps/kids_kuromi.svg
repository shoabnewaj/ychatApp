<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Black Jester Hat with Floppy Horns & Pink Spheres -->
    <path d="M50,55 C40,30 20,15 15,10 C18,25 35,45 42,60 Z" fill="#0f172a"/>
    <circle cx="14" cy="10" r="7" fill="#f43f5e"/>
    <path d="M110,55 C120,30 140,15 145,10 C142,25 125,45 118,60 Z" fill="#0f172a"/>
    <circle cx="146" cy="10" r="7" fill="#f43f5e"/>
    <!-- Black Jester Hood Frame around face -->
    <ellipse cx="80" cy="74" rx="50" ry="42" fill="#0f172a"/>
    <!-- The Iconic Hot Pink Skull on the forehead -->
    <circle cx="80" cy="46" r="9" fill="#f43f5e"/>
    <ellipse cx="76" cy="45" rx="2" ry="3" fill="#0f172a"/>
    <ellipse cx="84" cy="45" rx="2" ry="3" fill="#0f172a"/>
    <polygon points="76,55 84,55 80,59" fill="#f43f5e"/>
    <!-- White Inner Face -->
    <ellipse cx="80" cy="80" rx="36" ry="28" fill="#ffffff"/>
    <!-- Slanted Sassy Cat Eyes (One winking) -->
    <ellipse cx="62" cy="76" rx="7" ry="9" fill="#0f172a"/>
    <circle cx="64" cy="73" r="2.5" fill="#ffffff"/>
    <path d="M92,78 Q100,68 108,78" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <path d="M94,84 Q100,80 106,84" fill="none" stroke="#0f172a" stroke-width="2"/>
    <!-- Tiny Pink Nose -->
    <circle cx="80" cy="82" r="2" fill="#f43f5e"/>
    <!-- Cheeky Wavy Cat Smirk (3 mouth) -->
    <path d="M72,88 Q76,92 80,88 Q84,92 88,88" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Pink Blushing Cheeks -->
    <ellipse cx="48" cy="86" rx="6" ry="4" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="112" cy="86" rx="6" ry="4" fill="#f43f5e" opacity="0.6"/>
    <!-- Pointy Jester Collar with Pink Pompoms -->
    <polygon points="50,110 60,124 70,112 80,126 90,112 100,124 110,110" fill="#0f172a"/>
    <circle cx="60" cy="125" r="3.5" fill="#f43f5e"/>
    <circle cx="80" cy="127" r="3.5" fill="#f43f5e"/>
    <circle cx="100" cy="125" r="3.5" fill="#f43f5e"/>
    <!-- Banner -->
    <rect x="22" y="134" width="116" height="22" rx="11" fill="#0f172a" stroke="#f43f5e" stroke-width="1.8"/>
    <text x="80" y="149" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#f43f5e" text-anchor="middle">KUROMI! 🖤</text>
  </g>
</svg>