<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="pandaWhite" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f1f5f9"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Ears -->
    <circle cx="36" cy="38" r="18" fill="#1e293b"/>
    <circle cx="124" cy="38" r="18" fill="#1e293b"/>
    <!-- Head -->
    <ellipse cx="80" cy="74" rx="56" ry="48" fill="url(#pandaWhite)"/>
    <!-- Eye Patches -->
    <ellipse cx="54" cy="66" rx="14" ry="16" fill="#1e293b" transform="rotate(-15 54 66)"/>
    <path d="M50,66 Q56,60 62,66" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>
    <ellipse cx="106" cy="66" rx="14" ry="16" fill="#1e293b" transform="rotate(15 106 66)"/>
    <path d="M100,66 Q106,60 112,66" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Cheeks Blush -->
    <ellipse cx="44" cy="84" rx="10" ry="6" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="116" cy="84" rx="10" ry="6" fill="#f43f5e" opacity="0.6"/>
    <!-- Green Bamboo -->
    <rect x="25" y="85" width="110" height="12" rx="4" fill="#22c55e" transform="rotate(-15 80 90)"/>
    <line x1="60" y1="80" x2="60" y2="105" stroke="#15803d" stroke-width="2"/>
    <line x1="100" y1="70" x2="100" y2="95" stroke="#15803d" stroke-width="2"/>
    <!-- Paws holding Bamboo -->
    <circle cx="55" cy="94" r="10" fill="#1e293b"/>
    <circle cx="105" cy="80" r="10" fill="#1e293b"/>
    <!-- Chewing Mouth -->
    <ellipse cx="80" cy="88" rx="6" ry="4" fill="#f43f5e"/>
    <!-- Banner -->
    <rect x="30" y="130" width="100" height="24" rx="12" fill="#16a34a"/>
    <text x="80" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">NOM NOM 視</text>
  </g>
</svg>