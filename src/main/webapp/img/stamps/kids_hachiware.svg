<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Pointy Cat Ears (The iconic split blue pattern / Hachiware) -->
    <polygon points="46,45 32,20 60,30" fill="#38bdf8" stroke="#0f172a" stroke-width="2.5"/>
    <polygon points="114,45 128,20 100,30" fill="#38bdf8" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Head with Blue Split / 'Hachi' pattern on forehead -->
    <ellipse cx="80" cy="80" rx="52" ry="44" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <path d="M38,55 Q55,36 80,62 Q105,36 122,55 L120,40 Q80,28 40,40 Z" fill="#38bdf8"/>
    <!-- Cheerful Big Round Sparkle Eyes -->
    <ellipse cx="58" cy="74" rx="7" ry="10" fill="#0f172a"/>
    <ellipse cx="57" cy="70" rx="3.5" ry="5" fill="#ffffff"/>
    <circle cx="61" cy="78" r="1.5" fill="#ffffff"/>
    <ellipse cx="102" cy="74" rx="7" ry="10" fill="#0f172a"/>
    <ellipse cx="101" cy="70" rx="3.5" ry="5" fill="#ffffff"/>
    <circle cx="105" cy="78" r="1.5" fill="#ffffff"/>
    <!-- Rosy Cheeks -->
    <ellipse cx="46" cy="86" rx="9" ry="6" fill="#f43f5e" opacity="0.65"/>
    <ellipse cx="114" cy="86" rx="9" ry="6" fill="#f43f5e" opacity="0.65"/>
    <!-- Big Joyful Open Cat Smile ("Nantoka Nare! Somehow it will be fine!") -->
    <path d="M72,86 Q80,104 88,86 Z" fill="#e11d48" stroke="#0f172a" stroke-width="2"/>
    <path d="M76,88 Q80,94 84,88" fill="#fb7185"/>
    <!-- Waving Little Paw -->
    <circle cx="120" cy="98" r="9" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <!-- Banner -->
    <rect x="18" y="134" width="124" height="22" rx="11" fill="#0284c7" stroke="#bae6fd" stroke-width="1.5"/>
    <text x="80" y="149" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" fill="#ffffff" text-anchor="middle">NANTOKA NARE! 🐱</text>
  </g>
</svg>