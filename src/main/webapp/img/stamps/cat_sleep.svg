<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="catHead" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e0e7ff"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Night Cap -->
    <polygon points="40,30 90,0 80,50" fill="#6366f1"/>
    <circle cx="92" cy="2" r="8" fill="#fbbf24"/>
    <!-- Head -->
    <ellipse cx="80" cy="76" rx="55" ry="46" fill="url(#catHead)"/>
    <!-- Sleeping Eyes -.- -->
    <path d="M48,72 Q58,76 68,72" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <path d="M92,72 Q102,76 112,72" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <!-- Snot Bubble -->
    <circle cx="86" cy="78" r="10" fill="#93c5fd" opacity="0.75" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="83" cy="75" r="3" fill="#ffffff" opacity="0.8"/>
    <!-- ZZZ -->
    <text x="122" y="42" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" fill="#818cf8">Z</text>
    <text x="135" y="30" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#6366f1">Z</text>
    <!-- Banner -->
    <rect x="30" y="130" width="100" height="24" rx="12" fill="#6366f1"/>
    <text x="80" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">GOOD NIGHT 嫌</text>
  </g>
</svg>