<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="skin" cx="50%" cy="45%" r="50%"><stop offset="0%" stop-color="#fff5eb"/><stop offset="100%" stop-color="#fed7aa"/></radialGradient>
    <linearGradient id="strawHat" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#ca8a04"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Yellow Straw Hat Brim (Wide) -->
    <ellipse cx="80" cy="52" rx="65" ry="24" fill="url(#strawHat)" stroke="#a16207" stroke-width="2"/>
    <!-- Hat Crown -->
    <path d="M46,50 C46,20 114,20 114,50 Z" fill="url(#strawHat)"/>
    <!-- Red Hat Ribbon -->
    <path d="M46,45 C55,42 105,42 114,45 L114,51 C105,48 55,48 46,51 Z" fill="#dc2626"/>
    <!-- Black Messy Hair underneath brim -->
    <polygon points="35,62 48,78 52,65 65,82 72,66 85,82 95,66 108,80 115,64 125,62 110,54 50,54" fill="#0f172a"/>
    <!-- Face -->
    <ellipse cx="80" cy="85" rx="36" ry="36" fill="url(#skin)"/>
    <!-- Big Crescent Eyes (Joyful Laugh "Shishishi!") -->
    <path d="M54,78 Q64,68 74,78" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M86,78 Q96,68 106,78" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Eye scar under left eye (2 stitches) -->
    <path d="M57,85 Q62,87 67,86" fill="none" stroke="#b91c1c" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="59" y1="83" x2="60" y2="88" stroke="#b91c1c" stroke-width="1.5"/>
    <line x1="64" y1="84" x2="65" y2="89" stroke="#b91c1c" stroke-width="1.5"/>
    <!-- Giant D-Shaped Laughing Mouth -->
    <path d="M52,90 Q80,126 108,90 Z" fill="#991b1b"/>
    <!-- White Teeth Row -->
    <path d="M55,90 Q80,95 105,90 L102,96 Q80,102 58,96 Z" fill="#ffffff"/>
    <!-- Pink Tongue -->
    <path d="M68,105 Q80,98 92,105 Q80,122 68,105 Z" fill="#fb7185"/>
    <!-- Big Meat on Bone in hand! -->
    <rect x="18" y="98" width="30" height="20" rx="10" fill="#b45309" stroke="#78350f" stroke-width="1.5" transform="rotate(-15 33 108)"/>
    <circle cx="12" cy="102" r="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <circle cx="12" cy="112" r="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Red Vest -->
    <path d="M48,118 L38,142 L122,142 L112,118 Z" fill="#dc2626"/>
    <!-- Banner -->
    <rect x="22" y="134" width="116" height="22" rx="11" fill="#dc2626" stroke="#fef08a" stroke-width="1.5"/>
    <text x="80" y="149" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">SUGEEE!! 🍖</text>
  </g>
</svg>