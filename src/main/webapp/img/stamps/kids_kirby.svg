<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="kirbyPink" cx="45%" cy="35%" r="55%"><stop offset="0%" stop-color="#fbcfe8"/><stop offset="60%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Big Red Shoes / Feet -->
    <ellipse cx="50" cy="120" rx="18" ry="12" fill="#dc2626" transform="rotate(-15 50 120)"/>
    <ellipse cx="110" cy="120" rx="18" ry="12" fill="#dc2626" transform="rotate(15 110 120)"/>
    <!-- Perfect Round Pink Body -->
    <circle cx="80" cy="76" r="46" fill="url(#kirbyPink)"/>
    <!-- Left Hand Waving High in the Air -->
    <ellipse cx="36" cy="52" rx="12" ry="10" fill="url(#kirbyPink)" transform="rotate(-30 36 52)"/>
    <!-- Right Hand on Side -->
    <ellipse cx="124" cy="78" rx="12" ry="10" fill="url(#kirbyPink)" transform="rotate(20 124 78)"/>
    <!-- Giant Oval Eyes with Deep Blue Shading & White Highlights -->
    <ellipse cx="68" cy="65" rx="6" ry="13" fill="#0f172a"/>
    <ellipse cx="68" cy="72" rx="5" ry="5" fill="#2563eb"/>
    <ellipse cx="68" cy="60" rx="3.5" ry="5" fill="#ffffff"/>
    <ellipse cx="92" cy="65" rx="6" ry="13" fill="#0f172a"/>
    <ellipse cx="92" cy="72" rx="5" ry="5" fill="#2563eb"/>
    <ellipse cx="92" cy="60" rx="3.5" ry="5" fill="#ffffff"/>
    <!-- Rosy Oval Blushing Cheeks -->
    <ellipse cx="52" cy="78" rx="8" ry="4" fill="#fb7185" transform="rotate(-10 52 78)"/>
    <ellipse cx="108" cy="78" rx="8" ry="4" fill="#fb7185" transform="rotate(10 108 78)"/>
    <!-- The Cute Open Joyful Mouth ("Poyo!") -->
    <path d="M74,80 Q80,94 86,80 Z" fill="#991b1b"/>
    <path d="M76,82 Q80,88 84,82" fill="#f43f5e"/>
    <!-- Floating Warp Star Sparkles -->
    <polygon points="25,32 28,38 34,40 28,42 25,48 22,42 16,40 22,38" fill="#fde047"/>
    <polygon points="135,32 138,38 144,40 138,42 135,48 132,42 126,40 132,38" fill="#fde047"/>
    <!-- Banner -->
    <rect x="22" y="134" width="116" height="22" rx="11" fill="#ec4899" stroke="#fef08a" stroke-width="1.8"/>
    <text x="80" y="149" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">POYO! ⭐</text>
  </g>
</svg>