<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="pikaYellow" cx="50%" cy="45%" r="50%"><stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#facc15"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Pointy Ears with Black Tips -->
    <polygon points="35,55 5,5 25,2 52,38" fill="url(#pikaYellow)"/>
    <polygon points="12,12 5,5 25,2 20,10" fill="#0f172a"/>
    <polygon points="125,55 155,5 135,2 108,38" fill="url(#pikaYellow)"/>
    <polygon points="148,12 155,5 135,2 140,10" fill="#0f172a"/>
    <!-- Head -->
    <ellipse cx="80" cy="85" rx="46" ry="42" fill="url(#pikaYellow)"/>
    <!-- Bright Red Cheeks -->
    <circle cx="44" cy="94" r="10" fill="#ef4444"/>
    <circle cx="116" cy="94" r="10" fill="#ef4444"/>
    <!-- Right Eye Open with Sparkle, Left Eye Winking -->
    <circle cx="58" cy="78" r="9" fill="#0f172a"/>
    <circle cx="56" cy="75" r="3.5" fill="#ffffff"/>
    <path d="M94,80 Q102,70 110,80" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Cute '3' Shaped Cat/Pika Smile -->
    <path d="M72,94 Q76,98 80,94 Q84,98 88,94" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Floating Red Hearts around head -->
    <path d="M22,50 C22,44 28,40 33,44 C38,40 44,44 44,50 C44,58 33,65 33,65 C33,65 22,58 22,50 Z" fill="#ef4444"/>
    <path d="M125,45 C125,40 130,36 134,40 C138,36 143,40 143,45 C143,52 134,58 134,58 C134,58 125,52 125,45 Z" fill="#ef4444"/>
    <!-- Banner -->
    <rect x="20" y="134" width="120" height="22" rx="11" fill="#ef4444" stroke="#fbcfe8" stroke-width="1.5"/>
    <text x="80" y="149" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">PIKA PIKA! ❤️</text>
  </g>
</svg>