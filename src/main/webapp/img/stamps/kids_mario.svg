<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="marioSkin" cx="50%" cy="45%" r="50%"><stop offset="0%" stop-color="#fff5eb"/><stop offset="100%" stop-color="#fed7aa"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Big Red Plumber Cap (Crown & Visor) -->
    <path d="M35,52 C30,22 130,22 125,52 Z" fill="#dc2626"/>
    <ellipse cx="80" cy="54" rx="55" ry="14" fill="#ef4444"/>
    <!-- White Circle Emblem with Red 'M' on Cap -->
    <circle cx="80" cy="38" r="14" fill="#ffffff"/>
    <path d="M72,44 L72,32 L76,38 L80,32 L84,38 L88,32 L88,44 L85,44 L85,36 L81,41 L79,41 L75,36 L75,44 Z" fill="#dc2626"/>
    <!-- Face -->
    <ellipse cx="80" cy="80" rx="38" ry="34" fill="url(#marioSkin)"/>
    <!-- Big Bulbous Nose -->
    <circle cx="80" cy="74" r="14" fill="url(#marioSkin)" stroke="#fed7aa" stroke-width="1.5"/>
    <!-- Blue Eyes with Friendly Curved Brows -->
    <ellipse cx="64" cy="66" rx="5" ry="8" fill="#0284c7"/>
    <circle cx="63" cy="63" r="2" fill="#ffffff"/>
    <ellipse cx="96" cy="66" rx="5" ry="8" fill="#0284c7"/>
    <circle cx="95" cy="63" r="2" fill="#ffffff"/>
    <!-- THE FAMOUS BLACK 6-LOBED MARIO MUSTACHE -->
    <path d="M52,86 C54,82 60,82 64,85 C68,82 74,82 78,85 C82,82 88,82 92,85 C96,82 102,82 106,85 C108,82 114,82 116,86 C112,98 56,98 52,86 Z" fill="#1e1b4b"/>
    <!-- Joyful Open Smile under mustache -->
    <path d="M68,96 Q80,112 92,96 Z" fill="#991b1b"/>
    <path d="M74,96 L86,96" stroke="#ffffff" stroke-width="3"/>
    <!-- Red Shirt & Blue Overalls with Yellow Buttons -->
    <path d="M48,116 L35,140 L125,140 L112,116 Z" fill="#dc2626"/>
    <rect x="58" y="120" width="12" height="20" fill="#2563eb"/>
    <circle cx="64" cy="125" r="3" fill="#facc15"/>
    <rect x="90" y="120" width="12" height="20" fill="#2563eb"/>
    <circle cx="96" cy="125" r="3" fill="#facc15"/>
    <!-- Banner -->
    <rect x="22" y="134" width="116" height="22" rx="11" fill="#dc2626" stroke="#facc15" stroke-width="1.5"/>
    <text x="80" y="149" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">WAHOO! 🍄</text>
  </g>
</svg>