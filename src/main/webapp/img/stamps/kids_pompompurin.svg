<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="purinYellow" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#fde047"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Droopy Golden Retriever Ears -->
    <path d="M42,65 C30,70 20,85 24,102 C28,110 38,105 40,95 Z" fill="url(#purinYellow)" stroke="#eab308" stroke-width="1.5"/>
    <path d="M118,65 C130,70 140,85 136,102 C132,110 122,105 120,95 Z" fill="url(#purinYellow)" stroke="#eab308" stroke-width="1.5"/>
    <!-- Round Pudding Head -->
    <ellipse cx="80" cy="80" rx="48" ry="40" fill="url(#purinYellow)"/>
    <!-- The Iconic Brown Beret on top with little stem -->
    <ellipse cx="80" cy="46" rx="28" ry="12" fill="#78350f"/>
    <rect x="78" y="30" width="4" height="8" rx="2" fill="#78350f"/>
    <!-- Two Simple Black Dot Eyes -->
    <circle cx="62" cy="74" r="4.5" fill="#0f172a"/>
    <circle cx="98" cy="74" r="4.5" fill="#0f172a"/>
    <!-- Cute W-shaped Golden Retriever Smile & Round Nose -->
    <circle cx="80" cy="78" r="4" fill="#0f172a"/>
    <path d="M72,84 Q76,89 80,84 Q84,89 88,84" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Blushing Pink Cheeks -->
    <ellipse cx="48" cy="85" rx="8" ry="5" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="112" cy="85" rx="8" ry="5" fill="#f43f5e" opacity="0.6"/>
    <!-- Little Hands on Belly -->
    <ellipse cx="68" cy="115" rx="8" ry="10" fill="url(#purinYellow)" stroke="#eab308" stroke-width="1.2"/>
    <ellipse cx="92" cy="115" rx="8" ry="10" fill="url(#purinYellow)" stroke="#eab308" stroke-width="1.2"/>
    <!-- Banner -->
    <rect x="22" y="134" width="116" height="22" rx="11" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5"/>
    <text x="80" y="149" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#78350f" text-anchor="middle">PURIN! 🍮</text>
  </g>
</svg>