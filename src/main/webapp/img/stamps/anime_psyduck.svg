<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="duckYellow" cx="50%" cy="45%" r="50%"><stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#f59e0b"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- 3 Spiky Black Hairs on head -->
    <line x1="80" y1="42" x2="80" y2="24" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="77" y1="43" x2="68" y2="28" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="83" y1="43" x2="92" y2="28" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Big Round Yellow Head -->
    <circle cx="80" cy="80" r="42" fill="url(#duckYellow)"/>
    <!-- Big Wide Pale Bill (Beak) -->
    <ellipse cx="80" cy="94" rx="34" ry="18" fill="#fde68a" stroke="#d97706" stroke-width="1.8"/>
    <ellipse cx="74" cy="88" rx="2" ry="3" fill="#92400e"/>
    <ellipse cx="86" cy="88" rx="2" ry="3" fill="#92400e"/>
    <!-- Dizzy Vacant Blank Stare Eyes -->
    <circle cx="58" cy="68" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <circle cx="58" cy="68" r="3.5" fill="#0f172a"/>
    <circle cx="102" cy="68" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <circle cx="102" cy="68" r="3.5" fill="#0f172a"/>
    <!-- Flappers / Wings Holding Head in Agony/Headache -->
    <path d="M30,95 C25,75 35,55 50,60 C45,75 40,85 45,95 Z" fill="url(#duckYellow)" stroke="#d97706" stroke-width="1.5"/>
    <path d="M130,95 C135,75 125,55 110,60 C115,75 120,85 115,95 Z" fill="url(#duckYellow)" stroke="#d97706" stroke-width="1.5"/>
    <!-- Blue Confusion / Stress Squiggles -->
    <path d="M25,40 Q30,35 25,30 Q20,25 25,20" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <path d="M135,40 Q130,35 135,30 Q140,25 135,20" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <!-- Banner -->
    <rect x="22" y="134" width="116" height="22" rx="11" fill="#f59e0b" stroke="#fde68a" stroke-width="1.5"/>
    <text x="80" y="149" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#78350f" text-anchor="middle">PSYDUCK?! 😵‍💫</text>
  </g>
</svg>