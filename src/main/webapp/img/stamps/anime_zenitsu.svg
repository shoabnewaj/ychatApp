<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="skin" cx="50%" cy="45%" r="50%"><stop offset="0%" stop-color="#fff5eb"/><stop offset="100%" stop-color="#fed7aa"/></radialGradient>
    <linearGradient id="zenitsuHair" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fef08a"/><stop offset="70%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Bowl-cut Yellow Hair with Blocky Ends -->
    <path d="M35,65 C35,25 125,25 125,65 L128,78 L118,74 L110,80 L102,74 L94,82 L86,74 L78,82 L70,74 L62,80 L54,74 L46,80 L38,72 Z" fill="url(#zenitsuHair)"/>
    <!-- Face -->
    <ellipse cx="80" cy="85" rx="38" ry="36" fill="url(#skin)"/>
    <!-- Crying Droopy Slanted Brows (Utter Despair) -->
    <line x1="52" y1="78" x2="70" y2="70" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
    <line x1="108" y1="78" x2="90" y2="70" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
    <!-- Panic Shut Squinted Eyes -->
    <path d="M54,82 L68,82" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <path d="M92,82 L106,82" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <!-- MASSIVE WATERFALLS OF TEARS SHOOTING OUT SIDEWAYS -->
    <path d="M50,82 C30,82 10,95 5,115 C15,108 30,105 48,92 Z" fill="#38bdf8" opacity="0.9"/>
    <path d="M110,82 C130,82 150,95 155,115 C145,108 130,105 112,92 Z" fill="#38bdf8" opacity="0.9"/>
    <!-- Wide Screaming Wavy Mouth ("TANJIROOOO HELP ME!!") -->
    <polygon points="65,96 95,96 90,118 70,118" fill="#991b1b" stroke="#0f172a" stroke-width="2"/>
    <path d="M72,96 L88,96" stroke="#ffffff" stroke-width="4"/>
    <ellipse cx="80" cy="112" rx="8" ry="4" fill="#fb7185"/>
    <!-- Yellow Triangle Pattern Haori -->
    <path d="M44,120 L30,140 L130,140 L116,120 Z" fill="#eab308"/>
    <polygon points="50,132 56,124 62,132" fill="#ffffff"/>
    <polygon points="98,132 104,124 110,132" fill="#ffffff"/>
    <!-- Banner -->
    <rect x="20" y="134" width="120" height="22" rx="11" fill="#eab308" stroke="#fef08a" stroke-width="1.8"/>
    <text x="80" y="149" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#78350f" text-anchor="middle">TASUKETE!! 😭</text>
  </g>
