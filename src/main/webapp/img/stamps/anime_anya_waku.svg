<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="anyaSkin" cx="50%" cy="45%" r="50%"><stop offset="0%" stop-color="#fff5f5"/><stop offset="100%" stop-color="#fecdd3"/></radialGradient>
    <linearGradient id="anyaPinkHair" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fbcfe8"/><stop offset="100%" stop-color="#f472b6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Back Pink Hair -->
    <ellipse cx="80" cy="74" rx="52" ry="48" fill="url(#anyaPinkHair)"/>
    <!-- Horn Cones -->
    <polygon points="36,44 22,16 48,30" fill="#0f172a"/><polygon points="26,22 36,30 28,32" fill="#eab308"/>
    <polygon points="124,44 138,16 112,30" fill="#0f172a"/><polygon points="134,22 124,30 132,32" fill="#eab308"/>
    <!-- Face -->
    <ellipse cx="80" cy="85" rx="38" ry="34" fill="url(#anyaSkin)"/>
    <!-- Front Hair Bangs -->
    <path d="M38,58 Q80,48 122,58 Q115,75 106,62 Q95,78 80,60 Q65,78 54,62 Q45,75 38,58 Z" fill="url(#anyaPinkHair)"/>
    <!-- Giant Starry Glowing Eyes (WAKU WAKU!) -->
    <ellipse cx="58" cy="82" rx="13" ry="15" fill="#047857"/>
    <polygon points="58,72 61,79 68,82 61,85 58,92 55,85 48,82 55,79" fill="#fef08a"/>
    <circle cx="58" cy="82" r="3" fill="#ffffff"/>
    <ellipse cx="102" cy="82" rx="13" ry="15" fill="#047857"/>
    <polygon points="102,72 105,79 112,82 105,85 102,92 99,85 92,82 99,79" fill="#fef08a"/>
    <circle cx="102" cy="82" r="3" fill="#ffffff"/>
    <!-- Pink Round Blushing Cheeks -->
    <ellipse cx="42" cy="95" rx="8" ry="5" fill="#f43f5e" opacity="0.7"/>
    <ellipse cx="118" cy="95" rx="8" ry="5" fill="#f43f5e" opacity="0.7"/>
    <!-- Open Happy Mouth -->
    <path d="M72,98 Q80,114 88,98 Z" fill="#e11d48"/>
    <!-- Little Hands Clapped Together in Wonder -->
    <circle cx="74" cy="118" r="8" fill="url(#anyaSkin)"/>
    <circle cx="86" cy="118" r="8" fill="url(#anyaSkin)"/>
    <!-- Floating Sparkles -->
    <polygon points="20,50 23,55 28,57 23,59 20,64 17,59 12,57 17,55" fill="#fbbf24"/>
    <polygon points="140,50 143,55 148,57 143,59 140,64 137,59 132,57 137,55" fill="#fbbf24"/>
    <!-- Banner -->
    <rect x="18" y="134" width="124" height="22" rx="11" fill="#ec4899" stroke="#fef08a" stroke-width="1.8"/>
    <text x="80" y="149" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">WAKU WAKU! ✨</text>
  </g>
</svg>