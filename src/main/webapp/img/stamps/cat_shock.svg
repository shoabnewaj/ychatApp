<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="catHead" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#ffedd5"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Pointy Ears -->
    <polygon points="35,18 20,60 60,50" fill="#f97316"/>
    <polygon points="35,24 24,57 55,49" fill="#fda4af"/>
    <polygon points="125,18 100,50 140,60" fill="#f97316"/>
    <polygon points="125,24 105,49 136,57" fill="#fda4af"/>
    <!-- Head -->
    <ellipse cx="80" cy="74" rx="55" ry="46" fill="url(#catHead)"/>
    <!-- Shock Lines -->
    <path d="M80,10 L80,24 M65,14 L70,26 M95,14 L90,26" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <!-- Huge Shocked Eyes O.O -->
    <circle cx="56" cy="62" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <circle cx="56" cy="62" r="6" fill="#1e293b"/>
    <circle cx="54" cy="60" r="2" fill="#ffffff"/>
    <circle cx="104" cy="62" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <circle cx="104" cy="62" r="6" fill="#1e293b"/>
    <circle cx="102" cy="60" r="2" fill="#ffffff"/>
    <!-- Open Jaw O Mouth -->
    <ellipse cx="80" cy="88" rx="10" ry="16" fill="#1e293b"/>
    <ellipse cx="80" cy="96" rx="6" ry="6" fill="#f43f5e"/>
    <!-- Paws on cheeks -->
    <ellipse cx="38" cy="80" rx="10" ry="12" fill="#fff" stroke="#fdba74" stroke-width="2"/>
    <ellipse cx="122" cy="80" rx="10" ry="12" fill="#fff" stroke="#fdba74" stroke-width="2"/>
    <!-- Banner -->
    <rect x="35" y="130" width="90" height="24" rx="12" fill="#dc2626"/>
    <text x="80" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">OMG!! 亞</text>
  </g>
</svg>