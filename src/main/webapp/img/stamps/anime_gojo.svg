<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="skin" cx="50%" cy="45%" r="50%"><stop offset="0%" stop-color="#fff5f5"/><stop offset="100%" stop-color="#fed7aa"/></radialGradient>
    <linearGradient id="whiteHair" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient>
    <radialGradient id="sixEyes" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="40%" stop-color="#38bdf8"/><stop offset="80%" stop-color="#0284c7"/><stop offset="100%" stop-color="#1e3a8a"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Spiky Snow-White Hair -->
    <polygon points="35,55 12,30 35,22 22,2 50,14 62,-5 78,12 95,-5 106,14 135,2 122,22 148,30 125,55" fill="url(#whiteHair)"/>
    <!-- Face -->
    <polygon points="46,65 80,120 114,65" fill="url(#skin)"/>
    <ellipse cx="80" cy="78" rx="36" ry="36" fill="url(#skin)"/>
    <!-- Black Blindfold Pulled Down onto Forehead/Bridge -->
    <path d="M42,56 Q80,52 118,56 L120,68 Q80,64 40,68 Z" fill="#0f172a"/>
    <!-- THE SIX EYES (Celestial glowing radiant cyan/blue irises) -->
    <ellipse cx="62" cy="78" rx="10" ry="12" fill="url(#sixEyes)" filter="url(#glow)"/>
    <circle cx="62" cy="78" r="4" fill="#ffffff"/>
    <ellipse cx="98" cy="78" rx="10" ry="12" fill="url(#sixEyes)" filter="url(#glow)"/>
    <circle cx="98" cy="78" r="4" fill="#ffffff"/>
    <!-- Long white eyelashes -->
    <path d="M50,72 Q62,68 74,74" stroke="#ffffff" stroke-width="2.5" fill="none"/>
    <path d="M110,72 Q98,68 86,74" stroke="#ffffff" stroke-width="2.5" fill="none"/>
    <!-- Playful confident smirk -->
    <path d="M72,98 Q82,104 92,96" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Jujutsu High High-neck Black Jacket -->
    <path d="M42,118 L30,140 L130,140 L118,118 Z" fill="#0f172a"/>
    <!-- Crossed Fingers Hand Sign (Domain Expansion: Infinite Void) -->
    <rect x="74" y="112" width="6" height="24" rx="3" fill="url(#skin)" stroke="#fcd5be" stroke-width="1"/>
    <rect x="80" y="110" width="6" height="26" rx="3" fill="url(#skin)" stroke="#fcd5be" stroke-width="1"/>
    <!-- Banner -->
    <rect x="15" y="134" width="130" height="22" rx="11" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="80" y="149" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#38bdf8" text-anchor="middle">DOMAIN EXPANSION 🤞</text>
  </g>
</svg>