<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="animeSkin" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#fff1f2"/><stop offset="100%" stop-color="#fecdd3"/></radialGradient>
    <linearGradient id="hairBoy" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Spiky Blue Hair -->
    <path d="M30,70 L20,40 L45,45 L55,20 L75,35 L95,18 L105,38 L135,35 L125,70 Z" fill="url(#hairBoy)"/>
    <!-- Face -->
    <circle cx="80" cy="78" r="46" fill="url(#animeSkin)"/>
    <!-- Bangs -->
    <polygon points="50,45 60,65 70,45" fill="url(#hairBoy)"/>
    <polygon points="85,45 95,65 105,45" fill="url(#hairBoy)"/>
    <!-- Wink & Big Eye -->
    <path d="M50,75 Q60,65 70,75" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="98" cy="74" r="10" fill="#0284c7"/>
    <circle cx="95" cy="71" r="4" fill="#ffffff"/>
    <!-- Confident Grin -->
    <path d="M72,92 Q80,102 90,92" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <!-- Double Peace Hands (V) -->
    <g transform="translate(18, 85)">
      <polygon points="8,10 4,-5 12,-5 14,8" fill="#fecdd3" stroke="#0284c7" stroke-width="1.5"/>
      <polygon points="12,10 18,-8 26,-8 20,8" fill="#fecdd3" stroke="#0284c7" stroke-width="1.5"/>
      <circle cx="14" cy="14" r="8" fill="#fecdd3"/>
    </g>
    <!-- Banner -->
    <rect x="25" y="130" width="110" height="24" rx="12" fill="#0284c7"/>
    <text x="80" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">PEACE! V(^o^)</text>
  </g>
</svg>