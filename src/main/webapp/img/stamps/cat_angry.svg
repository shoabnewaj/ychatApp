<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="catHead" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#fee2e2"/><stop offset="100%" stop-color="#f87171"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Pointy Ears pinned back -->
    <polygon points="30,35 10,70 50,65" fill="#dc2626"/>
    <polygon points="130,35 110,65 150,70" fill="#dc2626"/>
    <!-- Head -->
    <ellipse cx="80" cy="74" rx="55" ry="46" fill="url(#catHead)"/>
    <!-- Angry Vein Mark 弔 -->
    <path d="M110,38 L126,38 M118,30 L118,46" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
    <path d="M113,33 L123,43 M123,33 L113,43" stroke="#b91c1c" stroke-width="2"/>
    <!-- Slanted Angry Eyes >.< -->
    <line x1="46" y1="58" x2="66" y2="68" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <line x1="46" y1="68" x2="66" y2="58" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <line x1="94" y1="58" x2="114" y2="68" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <line x1="94" y1="68" x2="114" y2="58" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <!-- Pouting / Hissing Mouth -->
    <polygon points="74,82 86,82 80,94" fill="#7f1d1d"/>
    <polygon points="76,82 78,86 80,82" fill="#fff"/>
    <polygon points="82,82 84,86 86,82" fill="#fff"/>
    <!-- Banner -->
    <rect x="35" y="130" width="90" height="24" rx="12" fill="#b91c1c"/>
    <text x="80" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">ANGRY! 弔</text>
  </g>
</svg>