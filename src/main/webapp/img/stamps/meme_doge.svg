<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="dogeGold" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#b45309"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Ears -->
    <polygon points="35,22 18,65 55,54" fill="#78350f"/>
    <polygon points="125,22 105,54 142,65" fill="#78350f"/>
    <!-- Head -->
    <ellipse cx="80" cy="74" rx="55" ry="46" fill="url(#dogeGold)"/>
    <ellipse cx="80" cy="86" rx="26" ry="18" fill="#fef3c7"/>
    <!-- Iconic Side-eye Doge Glance -->
    <ellipse cx="58" cy="62" rx="10" ry="10" fill="#ffffff"/>
    <circle cx="55" cy="62" r="5" fill="#1c1917"/>
    <circle cx="53" cy="60" r="1.5" fill="#ffffff"/>
    <ellipse cx="102" cy="62" rx="10" ry="10" fill="#ffffff"/>
    <circle cx="99" cy="62" r="5" fill="#1c1917"/>
    <circle cx="97" cy="60" r="1.5" fill="#ffffff"/>
    <!-- Black Nose & Smug Mouth -->
    <ellipse cx="80" cy="76" rx="6" ry="4" fill="#1c1917"/>
    <path d="M72,82 Q80,88 88,82" fill="none" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Classic Comic Sans Phrases -->
    <text x="20" y="32" font-family="'Comic Sans MS', sans-serif" font-size="12" font-weight="bold" fill="#ec4899">such cool</text>
    <text x="110" y="38" font-family="'Comic Sans MS', sans-serif" font-size="12" font-weight="bold" fill="#3b82f6">very happy</text>
    <!-- Banner -->
    <rect x="25" y="130" width="110" height="24" rx="12" fill="#d97706"/>
    <text x="80" y="146" font-family="'Comic Sans MS', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">MUCH WOW 枢</text>
  </g>
</svg>