<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="catSad" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e2e8f0"/></radialGradient>
    <linearGradient id="tearGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Droopy Ears -->
    <polygon points="40,32 18,72 58,62" fill="#94a3b8"/>
    <polygon points="40,38 25,69 54,60" fill="#fbcfe8"/>
    <polygon points="120,32 102,62 142,72" fill="#94a3b8"/>
    <polygon points="120,38 106,60 135,69" fill="#fbcfe8"/>
    <!-- Head -->
    <ellipse cx="80" cy="74" rx="55" ry="46" fill="url(#catSad)"/>
    <!-- Sad Eyes TT -->
    <path d="M48,68 Q58,78 68,68" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <path d="M92,68 Q102,78 112,68" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <!-- Waterfalls of Tears -->
    <path d="M50,70 Q45,100 48,135 Q58,138 60,135 Q65,100 62,70 Z" fill="url(#tearGrad)" opacity="0.85"/>
    <path d="M98,70 Q95,100 98,135 Q108,138 110,135 Q115,100 110,70 Z" fill="url(#tearGrad)" opacity="0.85"/>
    <!-- Quivering Mouth -->
    <path d="M72,85 Q76,80 80,85 Q84,80 88,85" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Banner -->
    <rect x="30" y="130" width="100" height="24" rx="12" fill="#3b82f6"/>
    <text x="80" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">SO SAD 亊</text>
  </g>
</svg>