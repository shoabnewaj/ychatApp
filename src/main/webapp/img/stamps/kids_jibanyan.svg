<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="jibaRed" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#f87171"/><stop offset="100%" stop-color="#dc2626"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Cyan Flame Tails (Will-o'-the-wisp) -->
    <path d="M25,50 C10,35 15,20 25,24 C35,28 32,45 25,50 Z" fill="#38bdf8"/>
    <path d="M135,50 C150,35 145,20 135,24 C125,28 128,45 135,50 Z" fill="#38bdf8"/>
    <!-- Cat Ears (Left ear has a notch/bite taken out) -->
    <polygon points="46,45 32,18 60,28" fill="url(#jibaRed)" stroke="#b91c1c" stroke-width="1.8"/>
    <polygon points="114,45 128,18 100,28" fill="url(#jibaRed)" stroke="#b91c1c" stroke-width="1.8"/>
    <!-- Left ear bite mark -->
    <circle cx="34" cy="22" r="4" fill="#ffffff"/>
    <!-- Red Cat Head -->
    <ellipse cx="80" cy="74" rx="50" ry="40" fill="url(#jibaRed)"/>
    <!-- White Muzzle -->
    <ellipse cx="80" cy="85" rx="30" ry="22" fill="#ffffff"/>
    <!-- Giant Yellow Eyes with Big Black Pupils -->
    <circle cx="60" cy="68" r="10" fill="#facc15" stroke="#0f172a" stroke-width="1.8"/>
    <circle cx="60" cy="68" r="5" fill="#0f172a"/>
    <circle cx="58" cy="66" r="2" fill="#ffffff"/>
    <circle cx="100" cy="68" r="10" fill="#facc15" stroke="#0f172a" stroke-width="1.8"/>
    <circle cx="100" cy="68" r="5" fill="#0f172a"/>
    <circle cx="98" cy="66" r="2" fill="#ffffff"/>
    <!-- Tiny Pink Nose & Sharp Cat Smile with Single Fang -->
    <circle cx="80" cy="76" r="3" fill="#f43f5e"/>
    <path d="M72,84 Q76,88 80,84 Q84,88 88,84" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="84,85 86,91 88,85" fill="#ffffff"/>
    <!-- Yellow Belt with Golden Bell -->
    <rect x="52" y="112" width="56" height="8" fill="#eab308"/>
    <circle cx="80" cy="116" r="5" fill="#0284c7"/>
    <!-- Flying Cat Paws Punching ("Paws of Fury!") -->
    <ellipse cx="38" cy="98" rx="8" ry="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" transform="rotate(-25 38 98)"/>
    <ellipse cx="122" cy="98" rx="8" ry="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" transform="rotate(25 122 98)"/>
    <!-- Banner -->
    <rect x="16" y="134" width="128" height="22" rx="11" fill="#dc2626" stroke="#facc15" stroke-width="1.5"/>
    <text x="80" y="149" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">PAWS OF FURY! 🐾</text>
  </g>
</svg>