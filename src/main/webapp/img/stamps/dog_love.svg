    <ellipse cx="80" cy="88" rx="26" ry="20" fill="#ffffff"/>
    <!-- Pink Cheeks -->
    <ellipse cx="46" cy="80" rx="10" ry="7" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="114" cy="80" rx="10" ry="7" fill="#f43f5e" opacity="0.6"/>
    <!-- Heart Eyes -->
    <path d="M60,62 C60,54 50,52 50,60 C50,68 60,74 60,74 C60,74 70,68 70,60 C70,52 60,54 60,62 Z" fill="#e11d48"/>
    <path d="M100,62 C100,54 90,52 90,60 C90,68 100,74 100,74 C100,74 110,68 110,60 C110,52 100,54 100,62 Z" fill="#e11d48"/>
    <ellipse cx="80" cy="78" rx="6" ry="4" fill="#1e293b"/>
    <path d="M74,84 Q80,92 86,84" fill="none" stroke="#1e293b" stroke-width="2.5"/>
