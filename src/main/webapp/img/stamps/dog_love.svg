    <text x="25" y="45" font-size="20" fill="#e11d48">猪</text>
    <text x="120" y="40" font-size="22" fill="#e11d48">瀦</text>
    <!-- Banner -->
    <rect x="30" y="130" width="100" height="24" rx="12" fill="#e11d48"/>
    <text x="80" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">FOR YOU 猪</text>
