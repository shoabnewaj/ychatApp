    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Ears -->
    <polygon points="40,20 20,60 55,52" fill="#b45309"/>
    <polygon points="120,20 105,52 140,60" fill="#b45309"/>
    <!-- Head -->
