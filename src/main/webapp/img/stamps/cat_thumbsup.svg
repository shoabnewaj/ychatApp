<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="catHead" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#fef08a"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Ears -->
    <polygon points="35,22 18,65 58,52" fill="#ca8a04"/>
    <polygon points="35,29 23,62 53,52" fill="#fde047"/>
    <polygon points="125,22 102,52 142,65" fill="#ca8a04"/>
    <polygon points="125,29 107,52 137,62" fill="#fde047"/>
    <!-- Head -->
    <ellipse cx="75" cy="74" rx="52" ry="46" fill="url(#catHead)"/>
    <!-- Sunglasses -->
    <polygon points="30,55 70,55 66,74 36,74" fill="#0f172a" rx="4"/>
    <polygon points="76,55 116,55 112,74 82,74" fill="#0f172a" rx="4"/>
    <rect x="68" y="58" width="10" height="4" fill="#0f172a"/>
    <line x1="38" y1="58" x2="62" y2="70" stroke="#94a3b8" stroke-width="2"/>
    <line x1="84" y1="58" x2="108" y2="70" stroke="#94a3b8" stroke-width="2"/>
    <!-- Smug Smile -->
    <path d="M68,82 Q76,92 88,82" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <!-- Giant Thumbs Up Paw -->
    <g transform="translate(110, 60)">
      <circle cx="16" cy="24" r="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <rect x="8" y="0" width="12" height="24" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <ellipse cx="14" cy="4" rx="4" ry="4" fill="#fda4af"/>
    </g>
    <!-- Banner -->
    <rect x="35" y="130" width="90" height="24" rx="12" fill="#16a34a"/>
    <text x="80" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">NICE! 総</text>
  </g>
</svg>