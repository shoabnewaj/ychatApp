<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="nezukoSkin" cx="50%" cy="45%" r="50%"><stop offset="0%" stop-color="#fff5f5"/><stop offset="100%" stop-color="#fecdd3"/></radialGradient>
    <linearGradient id="nezukoHair" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="70%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="bambooGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#86efac"/><stop offset="100%" stop-color="#15803d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Long Flowing Black Hair with Orange Flame Tips -->
    <path d="M35,50 C15,80 10,120 28,140 C38,125 35,90 40,65 Z" fill="url(#nezukoHair)"/>
    <path d="M125,50 C145,80 150,120 132,140 C122,125 125,90 120,65 Z" fill="url(#nezukoHair)"/>
    <!-- Cute Pink Ribbon on Forehead -->
    <rect x="52" y="38" width="14" height="10" rx="3" fill="#f43f5e" transform="rotate(-15 59 43)"/>
    <circle cx="58" cy="43" r="3" fill="#ffffff"/>
    <!-- Face -->
    <ellipse cx="80" cy="80" rx="38" ry="36" fill="url(#nezukoSkin)"/>
    <!-- Front Hair Bangs -->
    <path d="M42,52 Q80,42 118,52 Q112,68 104,58 Q90,72 80,56 Q70,72 56,58 Q48,68 42,52 Z" fill="#0f172a"/>
    <!-- Giant Glossy Pink Demon Eyes -->
    <ellipse cx="58" cy="74" rx="11" ry="14" fill="#f43f5e"/>
    <ellipse cx="58" cy="74" rx="4" ry="11" fill="#881337"/>
    <circle cx="56" cy="70" r="4" fill="#ffffff"/>
    <circle cx="62" cy="78" r="2" fill="#ffffff"/>
    <ellipse cx="102" cy="74" rx="11" ry="14" fill="#f43f5e"/>
    <ellipse cx="102" cy="74" rx="4" ry="11" fill="#881337"/>
    <circle cx="100" cy="70" r="4" fill="#ffffff"/>
    <circle cx="106" cy="78" r="2" fill="#ffffff"/>
    <!-- Blushing Pink Cheeks -->
    <ellipse cx="44" cy="85" rx="8" ry="4" fill="#fb7185" opacity="0.8"/>
    <ellipse cx="116" cy="85" rx="8" ry="4" fill="#fb7185" opacity="0.8"/>
    <!-- Green Bamboo Muzzle tied with Red Cord -->
    <line x1="38" y1="96" x2="122" y2="96" stroke="#dc2626" stroke-width="2.5"/>
    <rect x="56" y="88" width="48" height="16" rx="8" fill="url(#bambooGrad)" stroke="#14532d" stroke-width="1.5"/>
    <line x1="68" y1="88" x2="68" y2="104" stroke="#166534" stroke-width="1.8"/>
    <line x1="92" y1="88" x2="92" y2="104" stroke="#166534" stroke-width="1.8"/>
    <!-- Pink Kimono Pattern (Asanoha hemp leaf) -->
    <path d="M44,116 L30,140 L130,140 L116,116 Z" fill="#fbcfe8"/>
    <!-- Banner -->
    <rect x="22" y="134" width="116" height="22" rx="11" fill="#f43f5e" stroke="#fbcfe8" stroke-width="1.5"/>
    <text x="80" y="149" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">NEZUKO-CHAN ❤️</text>
  </g>
</svg>