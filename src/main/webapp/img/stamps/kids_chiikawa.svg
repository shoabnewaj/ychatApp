<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Round Chubby White Ears -->
    <circle cx="50" cy="46" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="110" cy="46" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Giant Soft White Marshmallow Body/Head -->
    <ellipse cx="80" cy="80" rx="52" ry="44" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <!-- THE FAMOUS CHIIKAWA TREMBLING TEARY EYES (Glossy dark oval with big white spark) -->
    <ellipse cx="58" cy="72" rx="7" ry="10" fill="#0f172a"/>
    <ellipse cx="57" cy="68" rx="3.5" ry="5" fill="#ffffff"/>
    <circle cx="61" cy="76" r="1.5" fill="#ffffff"/>
    <ellipse cx="102" cy="72" rx="7" ry="10" fill="#0f172a"/>
    <ellipse cx="101" cy="68" rx="3.5" ry="5" fill="#ffffff"/>
    <circle cx="105" cy="76" r="1.5" fill="#ffffff"/>
    <!-- Trembling Wavy Eyebrows (Super emotional/innocent) -->
    <path d="M50,56 Q58,52 66,58" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M94,58 Q102,52 110,56" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Cute Triangle Nose Dot & Tiny Wavy Mouth -->
    <polygon points="80,75 78,78 82,78" fill="#0f172a"/>
    <path d="M74,84 Q77,88 80,84 Q83,88 86,84" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Big Rosy Pink Blushing Cheeks -->
    <ellipse cx="46" cy="85" rx="9" ry="6" fill="#f43f5e" opacity="0.65"/>
    <line x1="42" y1="83" x2="50" y2="87" stroke="#be123c" stroke-width="1.2"/>
    <ellipse cx="114" cy="85" rx="9" ry="6" fill="#f43f5e" opacity="0.65"/>
    <line x1="110" y1="83" x2="118" y2="87" stroke="#be123c" stroke-width="1.2"/>
    <!-- Little Paws Clutched Together in Hope -->
    <circle cx="72" cy="108" r="8" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <circle cx="88" cy="108" r="8" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <!-- Banner -->
    <rect x="20" y="134" width="120" height="22" rx="11" fill="#ec4899" stroke="#fbcfe8" stroke-width="1.5"/>
    <text x="80" y="149" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">WAAAH! (ちいかわ)</text>
  </g>
</svg>