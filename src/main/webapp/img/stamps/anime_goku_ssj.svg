<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="skin" cx="50%" cy="45%" r="50%"><stop offset="0%" stop-color="#fff5eb"/><stop offset="100%" stop-color="#fed7aa"/></radialGradient>
    <linearGradient id="ssjHair" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fef08a"/><stop offset="50%" stop-color="#facc15"/><stop offset="100%" stop-color="#eab308"/></linearGradient>
    <radialGradient id="kiAura" cx="50%" cy="50%" r="50%"><stop offset="60%" stop-color="#38bdf8" stop-opacity="0.6"/><stop offset="100%" stop-color="#0284c7" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Electric Blue Ki Aura Background -->
    <circle cx="80" cy="75" r="68" fill="url(#kiAura)"/>
    <!-- Super Saiyan Spiky Golden Hair -->
    <polygon points="30,55 5,28 32,24 18,-2 52,14 62,-8 78,12 95,-8 105,14 138,-2 124,24 152,28 128,55" fill="url(#ssjHair)" stroke="#ca8a04" stroke-width="1.5"/>
    <!-- Face -->
    <polygon points="46,65 80,120 114,65" fill="url(#skin)"/>
    <ellipse cx="80" cy="78" rx="34" ry="32" fill="url(#skin)"/>
    <!-- Front Hair Bangs falling over forehead -->
    <polygon points="52,50 62,75 70,50" fill="url(#ssjHair)" stroke="#ca8a04" stroke-width="1"/>
    <polygon points="76,50 82,78 92,50" fill="url(#ssjHair)" stroke="#ca8a04" stroke-width="1"/>
    <!-- Teal Super Saiyan Eyes (Fierce warrior glance) -->
    <polygon points="56,76 72,79 70,86 58,84" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="62" y="77" width="5" height="8" fill="#06b6d4"/>
    <polygon points="88,79 104,76 102,84 90,86" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="93" y="77" width="5" height="8" fill="#06b6d4"/>
    <!-- Golden Eyebrows (Intense slant) -->
    <polygon points="52,72 74,78 72,82 50,75" fill="url(#ssjHair)"/>
    <polygon points="108,72 86,78 88,82 110,75" fill="url(#ssjHair)"/>
    <!-- Shouting open mouth (Powering up!) -->
    <polygon points="68,96 92,96 86,112 74,112" fill="#7f1d1d" stroke="#0f172a" stroke-width="1.5"/>
    <path d="M72,96 L88,96" stroke="#ffffff" stroke-width="3"/>
    <!-- Orange Turtle School Gi & Blue Undershirt -->
    <path d="M42,120 L30,140 L130,140 L118,120 Z" fill="#ea580c"/>
    <polygon points="65,120 80,136 95,120" fill="#1d4ed8"/>
    <!-- Banner -->
    <rect x="16" y="134" width="128" height="22" rx="11" fill="#ea580c" stroke="#facc15" stroke-width="1.8"/>
    <text x="80" y="149" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">KAMEHAMEHA!</text>
  </g>
</svg>