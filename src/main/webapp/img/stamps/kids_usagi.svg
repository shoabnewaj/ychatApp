<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="usagiYellow" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#fde047"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Tall Bunny Ears with Pink Insides -->
    <ellipse cx="60" cy="30" rx="8" ry="24" fill="url(#usagiYellow)" stroke="#0f172a" stroke-width="2.5" transform="rotate(-10 60 30)"/>
    <ellipse cx="60" cy="30" rx="4" ry="16" fill="#fbcfe8"/>
    <ellipse cx="100" cy="30" rx="8" ry="24" fill="url(#usagiYellow)" stroke="#0f172a" stroke-width="2.5" transform="rotate(10 100 30)"/>
    <ellipse cx="100" cy="30" rx="4" ry="16" fill="#fbcfe8"/>
    <!-- Chubby Yellow Bunny Head -->
    <ellipse cx="80" cy="80" rx="52" ry="44" fill="url(#usagiYellow)" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Manic Excited Wide Eyes -->
    <ellipse cx="58" cy="74" rx="7" ry="10" fill="#0f172a"/>
    <ellipse cx="57" cy="70" rx="3.5" ry="5" fill="#ffffff"/>
    <circle cx="61" cy="78" r="1.5" fill="#ffffff"/>
    <ellipse cx="102" cy="74" rx="7" ry="10" fill="#0f172a"/>
    <ellipse cx="101" cy="70" rx="3.5" ry="5" fill="#ffffff"/>
    <circle cx="105" cy="78" r="1.5" fill="#ffffff"/>
    <!-- Pink Cheeks -->
    <ellipse cx="46" cy="86" rx="9" ry="6" fill="#f43f5e" opacity="0.65"/>
    <ellipse cx="114" cy="86" rx="9" ry="6" fill="#f43f5e" opacity="0.65"/>
    <!-- Wild Open Shouting Mouth ("Ura! Yaha!") -->
    <ellipse cx="80" cy="94" rx="14" ry="16" fill="#991b1b" stroke="#0f172a" stroke-width="2"/>
    <ellipse cx="80" cy="98" rx="8" ry="8" fill="#fb7185"/>
    <!-- Fluffy Round Paws -->
    <circle cx="48" cy="115" r="9" fill="url(#usagiYellow)" stroke="#0f172a" stroke-width="2"/>
    <circle cx="112" cy="115" r="9" fill="url(#usagiYellow)" stroke="#0f172a" stroke-width="2"/>
    <!-- Banner -->
    <rect x="22" y="134" width="116" height="22" rx="11" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5"/>
    <text x="80" y="149" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#78350f" text-anchor="middle">YAHA! 🐰</text>
  </g>
