<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="ghostBlack" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#090d16"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Black Hooded Ghost Silhouette Body -->
    <path d="M42,140 C35,70 45,30 80,24 C115,30 125,70 118,140 Z" fill="url(#ghostBlack)"/>
    <!-- Pale Oval Noh Mask -->
    <ellipse cx="80" cy="74" rx="28" ry="38" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Purple Facial Markings (Two triangles on forehead and lower cheeks) -->
    <polygon points="74,48 86,48 80,58" fill="#7c3aed"/>
    <polygon points="74,100 86,100 80,90" fill="#7c3aed"/>
    <polygon points="60,82 66,74 68,84" fill="#7c3aed"/>
    <polygon points="100,82 94,74 92,84" fill="#7c3aed"/>
    <!-- Black Slit Eyes -->
    <ellipse cx="70" cy="68" rx="5" ry="3" fill="#0f172a"/>
    <ellipse cx="90" cy="68" rx="5" ry="3" fill="#0f172a"/>
    <!-- Small Oval Mask Mouth -->
    <ellipse cx="80" cy="84" rx="6" ry="4" fill="#0f172a"/>
    <!-- Shy Pink Blush on Mask -->
    <ellipse cx="60" cy="75" rx="6" ry="3" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="100" cy="75" rx="6" ry="3" fill="#f43f5e" opacity="0.6"/>
    <!-- Holding Shining Gold Nugget with ghostly little hands -->
    <ellipse cx="80" cy="116" rx="14" ry="10" fill="#eab308" stroke="#fef08a" stroke-width="1.5"/>
    <polygon points="80,108 83,114 89,116 83,118 80,124 77,118 71,116 77,114" fill="#ffffff"/>
    <!-- Banner -->
    <rect x="22" y="134" width="116" height="22" rx="11" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="80" y="149" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">AH... AH... ✨</text>
  </g>
</svg>