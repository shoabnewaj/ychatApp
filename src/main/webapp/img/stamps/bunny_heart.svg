<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="bunnyWhite" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#fdf2f8"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Long Bunny Ears -->
    <ellipse cx="55" cy="35" rx="14" ry="32" fill="#ffffff" stroke="#fbcfe8" stroke-width="1.5" transform="rotate(-10 55 35)"/>
    <ellipse cx="55" cy="35" rx="7" ry="24" fill="#fda4af" transform="rotate(-10 55 35)"/>
    <ellipse cx="105" cy="35" rx="14" ry="32" fill="#ffffff" stroke="#fbcfe8" stroke-width="1.5" transform="rotate(10 105 35)"/>
    <ellipse cx="105" cy="35" rx="7" ry="24" fill="#fda4af" transform="rotate(10 105 35)"/>
    <!-- Head -->
    <ellipse cx="80" cy="84" rx="52" ry="44" fill="url(#bunnyWhite)"/>
    <!-- Blushing Cheeks -->
    <circle cx="48" cy="90" r="10" fill="#f472b6" opacity="0.6"/>
    <circle cx="112" cy="90" r="10" fill="#f472b6" opacity="0.6"/>
    <!-- Big Anime Eyes -->
    <circle cx="60" cy="76" r="8" fill="#1e293b"/>
    <circle cx="58" cy="73" r="3" fill="#ffffff"/>
    <circle cx="100" cy="76" r="8" fill="#1e293b"/>
    <circle cx="98" cy="73" r="3" fill="#ffffff"/>
    <!-- Little Pink Nose & Y-mouth -->
    <ellipse cx="80" cy="85" rx="3.5" ry="2.5" fill="#f43f5e"/>
    <path d="M76,89 Q80,93 80,89 Q80,93 84,89" fill="none" stroke="#1e293b" stroke-width="2"/>
    <!-- Heart in Paws -->
    <path d="M80,105 C72,90 55,98 62,112 C72,125 80,132 80,132 C80,132 88,125 98,112 C105,98 88,90 80,105 Z" fill="#f43f5e"/>
    <circle cx="62" cy="112" r="7" fill="#fff" stroke="#fbcfe8"/>
    <circle cx="98" cy="112" r="7" fill="#fff" stroke="#fbcfe8"/>
    <!-- Banner -->
    <rect x="30" y="132" width="100" height="22" rx="11" fill="#ec4899"/>
    <text x="80" y="147" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">SO CUTE! 晴</text>
  </g>
</svg>