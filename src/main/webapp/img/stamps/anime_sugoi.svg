<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="animeSkin" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#fff1f2"/><stop offset="100%" stop-color="#fecdd3"/></radialGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#c084fc"/><stop offset="100%" stop-color="#7e22ce"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Back Hair Twintails -->
    <path d="M25,60 C10,90 15,120 35,130 C40,110 35,80 35,60 Z" fill="url(#hairGrad)"/>
    <path d="M135,60 C150,90 145,120 125,130 C120,110 125,80 125,60 Z" fill="url(#hairGrad)"/>
    <!-- Face -->
    <circle cx="80" cy="78" r="46" fill="url(#animeSkin)"/>
    <!-- Front Bangs -->
    <path d="M35,65 Q80,40 125,65 Q115,50 80,48 Q45,50 35,65 Z" fill="url(#hairGrad)"/>
    <polygon points="60,50 68,72 74,50" fill="url(#hairGrad)"/>
    <polygon points="86,50 92,72 100,50" fill="url(#hairGrad)"/>
    <!-- Giant Starry Eyes (Sugoi!) -->
    <ellipse cx="58" cy="78" rx="14" ry="16" fill="#7e22ce"/>
    <circle cx="58" cy="78" r="6" fill="#fbbf24"/>
    <polygon points="58,68 60,75 67,78 60,81 58,88 56,81 49,78 56,75" fill="#ffffff"/>
    <ellipse cx="102" cy="78" rx="14" ry="16" fill="#7e22ce"/>
    <circle cx="102" cy="78" r="6" fill="#fbbf24"/>
    <polygon points="102,68 104,75 111,78 104,81 102,88 100,81 93,78 100,75" fill="#ffffff"/>
    <!-- Blush -->
    <ellipse cx="44" cy="94" rx="10" ry="5" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="116" cy="94" rx="10" ry="5" fill="#f43f5e" opacity="0.6"/>
    <!-- Happy open mouth -->
    <path d="M74,94 Q80,104 86,94 Z" fill="#e11d48"/>
    <!-- Sparkles in air -->
    <polygon points="20,40 22,44 26,45 22,46 20,50 18,46 14,45 18,44" fill="#fbbf24"/>
    <polygon points="140,40 142,44 146,45 142,46 140,50 138,46 134,45 138,44" fill="#fbbf24"/>
    <!-- Banner -->
    <rect x="25" y="130" width="110" height="24" rx="12" fill="#9333ea"/>
    <text x="80" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">SUGOI! ✨</text>
  </g>
</svg>