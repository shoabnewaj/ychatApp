<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="pandaWhite" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f1f5f9"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Black Round Ears -->
    <circle cx="36" cy="38" r="18" fill="#1e293b"/>
    <circle cx="124" cy="38" r="18" fill="#1e293b"/>
    <!-- Chubby White Head -->
    <ellipse cx="80" cy="74" rx="56" ry="48" fill="url(#pandaWhite)"/>
    <!-- Oval Black Eye Patches -->
    <ellipse cx="54" cy="66" rx="14" ry="16" fill="#1e293b" transform="rotate(-15 54 66)"/>
    <circle cx="56" cy="64" r="5" fill="#ffffff"/>
    <ellipse cx="106" cy="66" rx="14" ry="16" fill="#1e293b" transform="rotate(15 106 66)"/>
    <circle cx="104" cy="64" r="5" fill="#ffffff"/>
    <!-- Cute Blush -->
    <ellipse cx="44" cy="84" rx="10" ry="6" fill="#fda4af" opacity="0.8"/>
    <ellipse cx="116" cy="84" rx="10" ry="6" fill="#fda4af" opacity="0.8"/>
    <!-- Nose & Mouth -->
    <ellipse cx="80" cy="78" rx="6" ry="4" fill="#0f172a"/>
    <path d="M74,84 Q80,90 86,84" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Heart Hug -->
    <path d="M80,95 C65,70 35,85 50,110 C65,130 80,140 80,140 C80,140 95,130 110,110 C125,85 95,70 80,95 Z" fill="#ec4899"/>
    <!-- Panda Paws -->
    <circle cx="50" cy="105" r="9" fill="#1e293b"/>
    <circle cx="110" cy="105" r="9" fill="#1e293b"/>
    <!-- Banner -->
    <rect x="30" y="130" width="100" height="24" rx="12" fill="#ec4899"/>
    <text x="80" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">HUG ME! 西</text>
  </g>
</svg>